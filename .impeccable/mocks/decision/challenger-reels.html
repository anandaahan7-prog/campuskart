<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CampusKart · vertical feed challenger</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:844px;overflow:hidden;font:15px/1.4 Figtree,sans-serif;color:#fff;background:#0d0b14}
.item{position:absolute;inset:0;background:radial-gradient(120% 80% at 40% 30%,#3b6fd8,#141a3a 70%)}
.top{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;gap:22px;font-weight:800;font-size:17px}
.top span{opacity:.6}.top span.on{opacity:1;border-bottom:3px solid #fff;padding-bottom:4px}
.art{position:absolute;top:150px;left:0;right:0;text-align:center;font-size:170px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.5))}
.rail{position:absolute;right:14px;bottom:190px;display:grid;gap:22px;text-align:center;font-weight:800;font-size:12px}
.rail div{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;margin:0 auto 4px}
.rail .buy{background:#ff4d6d}
.cap{position:absolute;left:18px;right:90px;bottom:100px}
.seller{font-weight:800;font-size:15px}.title{font-size:22px;font-weight:800;line-height:1.15;margin:6px 0}
.price{font-size:36px;font-weight:800;letter-spacing:-.03em}.price s{font-size:15px;opacity:.6;font-weight:400;margin-left:8px}
.why{display:inline-block;margin-top:8px;font-size:13px;background:rgba(160,120,255,.35);padding:5px 10px;border-radius:14px}
.tab{position:absolute;bottom:0;left:0;right:0;height:64px;background:#000;display:grid;grid-template-columns:repeat(5,1fr);place-items:center;font-size:11px;font-weight:600;opacity:.95}
.tab .plus{background:#fff;color:#000;border-radius:10px;width:44px;height:30px;display:grid;place-items:center;font-size:20px;font-weight:800}
</style></head><body>
<div class="item"></div>
<div class="top"><span>Nearby</span><span class="on">For you</span><span>Deals</span></div>
<div class="art">💻</div>
<div class="rail"><div>♡</div>Save<div>₹</div>Offer<div class="buy">⚡</div>Buy</div>
<div class="cap"><div class="seller">Vikram Singh · CSE Y4 ★4.5</div><div class="title">Dell Inspiron 15 · i5, 8GB, 512GB SSD</div>
<div class="price">₹26,000<s>₹52,000</s></div><div class="why">✦ In your wishlist · fair price</div></div>
<div class="tab"><span>Home</span><span>Search</span><span class="plus">+</span><span>Offers</span><span>Me</span></div>
</body></html>
